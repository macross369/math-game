<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學計算能力挑戰王</title>
    <!-- 引入 Tailwind CSS 進行現代化響應式排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 html2pdf 庫供匯出 PDF 使用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col items-center justify-center p-3 md:p-6 text-gray-800">

<!-- 修改：使用轉換後的 Google Drive 直接連結 -->
<div class="w-full max-w-4xl flex items-center justify-start mb-4 px-2 fade-in">
    <img src="https://lh3.googleusercontent.com/d/1qUdM3yxfDP9U8S1PAlYScLXLG9riPxMt" alt="閒雲數學小棧Logo" class="h-8 w-auto mr-3 object-contain drop-shadow-md rounded-full bg-white/30 p-1" onerror="this.src='https://placehold.co/40x40/ffffff/333333?text=Logo'">
    <span class="text-xl md:text-2xl font-bold text-white drop-shadow-lg tracking-wider" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">閒雲數學小棧</span>
</div>

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-5 md:p-8 transition-all duration-300 my-auto">
        
        <!-- 標題列 -->
        <div class="text-center mb-5">
            <h1 class="text-2xl md:text-4xl font-extrabold text-indigo-600 flex items-center justify-center gap-2 md:gap-3">
                <i class="fa-solid fa-crown text-yellow-500"></i> 數學計算能力挑戰王
            </h1>
            <p class="text-gray-500 mt-1.5 text-xs md:text-sm">多重主題數學大挑戰，支援語音辨識、螢幕觸控鍵盤與錯題 PDF 匯出！</p>
        </div>

        <!-- 畫面一：設定區 -->
        <div id="setup-screen" class="space-y-5">
            <div class="bg-indigo-50/70 p-4 md:p-5 rounded-2xl border border-indigo-100 space-y-4">
                
                <!-- 四大主要主題選擇 (馬卡龍色系按鈕) -->
                <div>
                    <label class="block font-extrabold text-gray-800 text-sm md:text-base mb-2.5">
                        <i class="fa-solid fa-book-open text-indigo-500 mr-1.5"></i> 選擇測驗主題：
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                        <label id="topic-label-multiply" class="flex items-center justify-center p-3 border-2 rounded-2xl cursor-pointer transition-all duration-200 shadow-sm">
                            <input type="radio" name="topic" value="multiply" checked onclick="updateModeOptions()" class="hidden">
                            <span class="text-xs md:text-sm font-black flex items-center gap-1"><i class="fa-solid fa-xmark text-xs"></i> 乘法運算</span>
                        </label>
                        <label id="topic-label-add" class="flex items-center justify-center p-3 border-2 rounded-2xl cursor-pointer transition-all duration-200 shadow-sm">
                            <input type="radio" name="topic" value="add" onclick="updateModeOptions()" class="hidden">
                            <span class="text-xs md:text-sm font-black flex items-center gap-1"><i class="fa-solid fa-plus text-xs"></i> 加法運算</span>
                        </label>
                        <label id="topic-label-sub" class="flex items-center justify-center p-3 border-2 rounded-2xl cursor-pointer transition-all duration-200 shadow-sm">
                            <input type="radio" name="topic" value="sub" onclick="updateModeOptions()" class="hidden">
                            <span class="text-xs md:text-sm font-black flex items-center gap-1"><i class="fa-solid fa-minus text-xs"></i> 減法運算</span>
                        </label>
                        <label id="topic-label-divide" class="flex items-center justify-center p-3 border-2 rounded-2xl cursor-pointer transition-all duration-200 shadow-sm">
                            <input type="radio" name="topic" value="divide" onclick="updateModeOptions()" class="hidden">
                            <span class="text-xs md:text-sm font-black flex items-center gap-1"><i class="fa-solid fa-divide text-xs"></i> 除法運算</span>
                        </label>
                    </div>
                </div>

                <!-- 次類別與題型模式容器 -->
                <div>
                    <label class="block font-extrabold text-gray-800 text-sm md:text-base mb-2.5">
                        <i class="fa-solid fa-layer-group text-indigo-500 mr-1.5"></i> 選擇類別與題型模式：
                    </label>
                    <div class="grid grid-cols-1 gap-3" id="mode-container">
                        <!-- 動態切換顯示 -->
                    </div>
                </div>

                <!-- 選擇秒數 -->
                <div>
                    <label class="block font-extrabold text-gray-800 text-sm md:text-base mb-2">
                        <i class="fa-solid fa-stopwatch text-indigo-500 mr-1.5"></i> 每題限制秒數：
                    </label>
                    <select id="time-limit" class="w-full p-2.5 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none font-semibold text-sm md:text-base">
                        <option value="1">1 秒 (閃電極速)</option>
                        <option value="2">2 秒 (高壓挑戰)</option>
                        <option value="3">3 秒 (極速挑戰)</option>
                        <option value="5" selected>5 秒 (標準挑戰)</option>
                        <option value="8">8 秒 (輕鬆練習)</option>
                        <option value="10">10 秒 (進階專用)</option>
                    </select>
                </div>
            </div>

            <button onclick="startGame()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base md:text-lg rounded-2xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 開始挑戰
            </button>
        </div>

        <!-- 畫面二：遊戲作答區 -->
        <div id="game-screen" class="hidden space-y-4">
            <!-- 頂部資訊列 -->
            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl border">
                <div class="text-xs md:text-sm font-semibold text-gray-600">
                    進度：<span id="current-index" class="text-indigo-600 font-bold">1</span> / <span id="total-count">45</span> 題
                </div>
                <div id="timer-box" class="flex items-center gap-1.5 px-3 py-1 bg-amber-100 text-amber-800 rounded-full font-bold text-xs md:text-sm">
                    <i class="fa-solid fa-clock"></i> <span id="time-left">5</span> 秒
                </div>
            </div>

            <!-- 牌卡區 -->
            <div onclick="manualStartSpeech()" title="點擊嘗試啟用麥克風" class="flex flex-col items-center justify-center py-7 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl shadow-inner text-white relative overflow-hidden cursor-pointer hover:opacity-95 transition">
                <div class="text-4xl md:text-6xl font-black tracking-wider drop-shadow-md select-none" id="card-question">
                    15 + 7 = ?
                </div>
                <div class="mt-4 flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full text-xs md:text-sm font-medium animate-pulse select-none text-center" id="mic-status-text">
                    <i class="fa-solid fa-microphone text-red-300"></i> 請說出答案 (或點擊嘗試開啟麥克風)
                </div>
            </div>

            <!-- 輸入與螢幕觸控數字鍵盤區 -->
            <div class="space-y-3 bg-gray-50 p-3.5 rounded-2xl border">
                <div class="flex items-center justify-between text-xs text-gray-500">
                    <span>語音辨識：<b id="transcript" class="text-indigo-600 italic">（等待中...）</b></span>
                    <span class="text-gray-400">可用螢幕鍵盤作答</span>
                </div>
                
                <!-- 手動輸入顯示框與送出按鈕 (已調小輸入框寬度並居中排列) -->
                <div class="flex justify-center items-center gap-2">
                    <input type="number" id="manual-input" placeholder="答案" class="w-28 p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center text-xl font-bold bg-white" onkeydown="if(event.key==='Enter') submitManualAnswer()">
                    <button onclick="submitManualAnswer()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-paper-plane"></i> 送出
                    </button>
                </div>

                <!-- 螢幕觸控數字大鍵盤 (適合 GAS / 平板 / 觸控大屏) -->
                <div class="grid grid-cols-3 gap-1.5 max-w-xs mx-auto pt-1">
                    <button onclick="pressKey('1')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">1</button>
                    <button onclick="pressKey('2')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">2</button>
                    <button onclick="pressKey('3')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">3</button>
                    <button onclick="pressKey('4')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">4</button>
                    <button onclick="pressKey('5')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">5</button>
                    <button onclick="pressKey('6')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">6</button>
                    <button onclick="pressKey('7')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">7</button>
                    <button onclick="pressKey('8')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">8</button>
                    <button onclick="pressKey('9')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">9</button>
                    <button onclick="pressKey('clear')" class="py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-sm rounded-xl shadow-sm border border-rose-200 flex items-center justify-center gap-1"><i class="fa-solid fa-rotate-left"></i> 清除</button>
                    <button onclick="pressKey('0')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-gray-800 font-extrabold text-lg rounded-xl shadow-sm border border-gray-200">0</button>
                    <button onclick="pressKey('back')" class="py-2.5 bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold text-sm rounded-xl shadow-sm border border-amber-200 flex items-center justify-center gap-1"><i class="fa-solid fa-delete-left"></i> 退格</button>
                </div>
            </div>

            <!-- 控制按鈕列：暫停與中止 -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <button id="pause-btn" onclick="togglePause()" class="py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-pause"></i> 暫停遊戲
                </button>
                <button onclick="abortGame()" class="py-2.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-stop"></i> 中止挑戰
                </button>
            </div>
        </div>

        <!-- 畫面三：結算與錯題列表區 -->
        <div id="result-screen" class="hidden space-y-5">
            <div class="text-center space-y-1.5">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full text-3xl mb-1">
                    <i class="fa-solid fa-award"></i>
                </div>
                <h2 id="result-title" class="text-2xl md:text-3xl font-extrabold text-gray-800">挑戰完成！</h2>
                <p class="text-gray-500 text-xs md:text-sm">來看看你的計算能力表現與錯題分析吧！</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-green-50 border border-green-200 p-3.5 rounded-2xl text-center">
                    <div class="text-xs text-green-600 font-semibold">答對題數</div>
                    <div id="correct-count" class="text-2xl md:text-3xl font-extrabold text-green-700 mt-0.5">0</div>
                </div>
                <div class="bg-red-50 border border-red-200 p-3.5 rounded-2xl text-center">
                    <div class="text-xs text-red-600 font-semibold">錯題/未完成題數</div>
                    <div id="wrong-count" class="text-2xl md:text-3xl font-extrabold text-red-700 mt-0.5">0</div>
                </div>
            </div>

            <!-- 錯題清單區塊 (供畫面檢視與匯出 PDF 使用) -->
            <div id="pdf-export-area" class="space-y-3 bg-white p-5 rounded-2xl border border-gray-200 shadow-sm">
                <div class="flex justify-between items-center border-b pb-2.5">
                    <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 需要加強的錯題記錄
                    </h3>
                    <span class="text-xs text-gray-500 font-medium">數學計算能力挑戰王 報告</span>
                </div>
                
                <div id="wrong-list-container" class="max-h-60 overflow-y-auto space-y-2">
                    <!-- 動態填入 -->
                </div>
            </div>

            <!-- 操作按鈕列 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="downloadPDF()" class="py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-pdf"></i> 下載錯題 PDF 檔
                </button>
                <button onclick="resetGame()" class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 再次挑戰
                </button>
            </div>
        </div>

    </div>

    <!-- 邏輯控制 JavaScript -->
    <script>
        let questions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongRecords = []; 
        let timeLimit = 5;
        let timeLeft = 5;
        let timer = null;
        let recognition = null;
        let isAnswering = false;
        let isPaused = false;
        let lastTranscript = '';

        window.onload = function() {
            updateModeOptions();
        };

        function updateModeOptions() {
            const topic = document.querySelector('input[name="topic"]:checked').value;
            const container = document.getElementById('mode-container');
            
            const topics = ['multiply', 'add', 'sub', 'divide'];
            const colorMap = {
                multiply: {
                    active: 'bg-rose-100 border-rose-400 text-rose-800 shadow-md ring-2 ring-rose-300 scale-[1.02]',
                    inactive: 'bg-rose-50/60 border-rose-200 text-rose-700 hover:bg-rose-100/80',
                    cardBg: 'bg-rose-50/40 border-rose-200',
                    badge: 'bg-rose-200 text-rose-900 border-rose-300',
                    labelBorder: 'border-rose-200 hover:border-rose-400 bg-white',
                    radio: 'text-rose-600 focus:ring-rose-500'
                },
                add: {
                    active: 'bg-amber-100 border-amber-400 text-amber-800 shadow-md ring-2 ring-amber-300 scale-[1.02]',
                    inactive: 'bg-amber-50/60 border-amber-200 text-amber-700 hover:bg-amber-100/80',
                    cardBg: 'bg-amber-50/40 border-amber-200',
                    badge: 'bg-amber-200 text-amber-900 border-amber-300',
                    labelBorder: 'border-amber-200 hover:border-amber-400 bg-white',
                    radio: 'text-amber-600 focus:ring-amber-500'
                },
                sub: {
                    active: 'bg-sky-100 border-sky-400 text-sky-800 shadow-md ring-2 ring-sky-300 scale-[1.02]',
                    inactive: 'bg-sky-50/60 border-sky-200 text-sky-700 hover:bg-sky-100/80',
                    cardBg: 'bg-sky-50/40 border-sky-200',
                    badge: 'bg-sky-200 text-sky-900 border-sky-300',
                    labelBorder: 'border-sky-200 hover:border-sky-400 bg-white',
                    radio: 'text-sky-600 focus:ring-sky-500'
                },
                divide: {
                    active: 'bg-emerald-100 border-emerald-400 text-emerald-800 shadow-md ring-2 ring-emerald-300 scale-[1.02]',
                    inactive: 'bg-emerald-50/60 border-emerald-200 text-emerald-700 hover:bg-emerald-100/80',
                    cardBg: 'bg-emerald-50/40 border-emerald-200',
                    badge: 'bg-emerald-200 text-emerald-900 border-emerald-300',
                    labelBorder: 'border-emerald-200 hover:border-emerald-400 bg-white',
                    radio: 'text-emerald-600 focus:ring-emerald-500'
                }
            };

            topics.forEach(t => {
                const labelElem = document.getElementById(`topic-label-${t}`);
                if (labelElem) {
                    labelElem.className = (t === topic) ? 
                        `flex items-center justify-center p-3 border-2 rounded-2xl cursor-pointer transition-all duration-200 ${colorMap[t].active}` :
                        `flex items-center justify-center p-3 border-2 rounded-2xl cursor-pointer transition-all duration-200 ${colorMap[t].inactive}`;
                }
            });

            const currentTheme = colorMap[topic];

            if (topic === 'multiply') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="${currentTheme.cardBg} p-3.5 rounded-2xl border space-y-2.5">
                            <div class="text-sm font-extrabold ${currentTheme.badge} px-3 py-1 rounded-lg inline-block border">類別一：九九乘法</div>
                            <div class="grid grid-cols-1 gap-2">
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="mul-9x9-standard" checked class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">標準模式 (2×1與1×2不同，共81題)</span>
                                </label>
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="mul-9x9-same" class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">精簡模式 (2×1與1×2相同，共45題)</span>
                                </label>
                            </div>
                        </div>

                        <div class="${currentTheme.cardBg} p-3.5 rounded-2xl border space-y-2.5">
                            <div class="text-sm font-extrabold ${currentTheme.badge} px-3 py-1 rounded-lg inline-block border">類別二：十十乘法</div>
                            <div class="grid grid-cols-1 gap-2">
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="mul-10x10-standard" class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">標準模式 (2×1與1×2不同，共100題)</span>
                                </label>
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="mul-10x10-same" class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">精簡模式 (2×1與1×2相同，共55題)</span>
                                </label>
                            </div>
                        </div>

                        <div class="${currentTheme.cardBg} p-3.5 rounded-2xl border space-y-2.5">
                            <div class="text-sm font-extrabold ${currentTheme.badge} px-3 py-1 rounded-lg inline-block border">類別三：特殊計算：25的倍數</div>
                            <div class="grid grid-cols-1 gap-2">
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="mul-25" class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">標準模式 (25 × 1~8，共8題)</span>
                                </label>
                            </div>
                        </div>

                        <div class="${currentTheme.cardBg} p-3.5 rounded-2xl border space-y-2.5">
                            <div class="text-sm font-extrabold ${currentTheme.badge} px-3 py-1 rounded-lg inline-block border">類別四：特殊計算：125的倍數</div>
                            <div class="grid grid-cols-1 gap-2">
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="mul-125" class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">標準模式 (125 × 1~8，共8題)</span>
                                </label>
                            </div>
                        </div>

                        <div class="${currentTheme.cardBg} p-3.5 rounded-2xl border space-y-2.5">
                            <div class="text-sm font-extrabold ${currentTheme.badge} px-3 py-1 rounded-lg inline-block border">類別五：11~20 × 2~10</div>
                            <div class="grid grid-cols-1 gap-2">
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="mul-11_20x2_10" class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">標準模式 (11~20 × 2~10，共90題)</span>
                                </label>
                            </div>
                        </div>
                    </div>
                `;
            } else if (topic === 'add') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="${currentTheme.cardBg} p-3.5 rounded-2xl border space-y-2.5">
                            <div class="text-sm font-extrabold ${currentTheme.badge} px-3 py-1 rounded-lg inline-block border">類別一：一位數加法</div>
                            <div class="grid grid-cols-1 gap-2">
                                <label class="flex items-center p-2.5 ${currentTheme.labelBorder} rounded-xl cursor-pointer transition shadow-sm">
                                    <input type="radio" name="mode" value="add1-distinct" checked class="${currentTheme.radio} h-4 w-4">
                                    <span class="ml-2 text-sm font-bold text-gray-800">進階模式 (A+B與B+A不同，共81題)</span>

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn("瀏覽器不支援語音辨識。");
                document.getElementById('mic-status-text').innerHTML = `<i class="fa-solid fa-keyboard text-amber-200"></i> 請使用下方螢幕鍵盤作答`;
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (isPaused || !isAnswering) return;
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const transcriptText = finalTranscript || interimTranscript;
                lastTranscript = transcriptText;
                document.getElementById('transcript').innerText = transcriptText;

                if (finalTranscript) {
                    processSpokenAnswer(finalTranscript);
                }
            };

            recognition.onerror = (event) => {
                console.warn("語音辨識事件/權限提示:", event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    // 當在 GAS Iframe 被 Chrome 安全政策阻擋時，顯示明確指引
                    document.getElementById('mic-status-text').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-300"></i> GAS網頁封鎖麥克風，請使用下方螢幕鍵盤作答`;
                }
            };

            recognition.onend = () => {
                if (isAnswering && !isPaused) {
                    try { recognition.start(); } catch (e) {}
                }
            };
        }

        // 主動探測與啟動語音 (帶有完整錯誤 capture)
        async function manualStartSpeech() {
            if (!isAnswering || isPaused) return;
            const micStatus = document.getElementById('mic-status-text');
            micStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-yellow-200"></i> 正在連線麥克風...`;

            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                }
                if (!recognition) {
                    initSpeechRecognition();
                }
                recognition.start();
                micStatus.innerHTML = `<i class="fa-solid fa-microphone text-green-300"></i> 麥克風聆聽中... (請口述或用鍵盤)`;
            } catch (err) {
                console.warn("GAS iframe 封鎖麥克風權限或拒絕存取:", err);
                micStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-300"></i> GAS網頁封鎖麥克風，請使用下方螢幕鍵盤作答`;
            }
        }

                    }
                } else if (mode === 'mul-10x10-standard') {
                    for (let i = 1; i <= 10; i++) {
                        for (let j = 1; j <= 10; j++) {
                            list.push({ a: i, b: j, op: '×', ans: i * j });
                        }
                    }
                } else if (mode === 'mul-10x10-same') {
                    for (let i = 1; i <= 10; i++) {
                        for (let j = i; j <= 10; j++) {
                            list.push({ a: i, b: j, op: '×', ans: i * j });
                        }
                    }
                } else if (mode === 'mul-25') {
                    for (let i = 1; i <= 8; i++) {
                        list.push({ a: 25, b: i, op: '×', ans: 25 * i });
                    }
                } else if (mode === 'mul-125') {
                    for (let i = 1; i <= 8; i++) {
                        list.push({ a: 125, b: i, op: '×', ans: 125 * i });
                    }
                } else if (mode === 'mul-11_20x2_10') {
                    for (let i = 11; i <= 20; i++) {
                        for (let j = 2; j <= 10; j++) {

                        }
                    }

            } else if (topic === 'add') {
                if (mode === 'add1-distinct') {

                        for (let j = 1; j <= 9; j++) {
                            list.push({ a: i, b: j, op: '+', ans: i + j });

                            list.push({ a: i, b: j, op: '-', ans: i - j });

                                list.push({ a: n, b: d, op: '÷', ans: n / d });

                                list.push({ a: n, b: d, op: '÷', ans: n / d });

                                list.push({ a: n, b: d, op: '÷', ans: n / d });

                                list.push({ a: n, b: d, op: '÷', ans: n / d });

        function nextQuestion() {
            if (currentIndex >= questions.length) {
                endGame("挑戰完成！");
                return;

            document.getElementById('current-index').innerText = currentIndex + 1;
            const currentQ = questions[currentIndex];
            const displayText = currentQ.display ? currentQ.display : `${currentQ.a} ${currentQ.op} ${currentQ.b} = ?`;
            document.getElementById('card-question').innerText = displayText;
            document.getElementById('transcript').innerText = '（聆聽中...）';
            document.getElementById('manual-input').value = '';
            document.getElementById('mic-status-text').innerHTML = `<i class="fa-solid fa-microphone text-red-300"></i> 請說出答案 (或使用下方螢幕鍵盤)`;
            lastTranscript = '';

            if (recognition && !isPaused) {
                isAnswering = true;
                try { recognition.start(); } catch (e) {}
            }

            timeLeft = timeLimit;
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('timer-box').classList.remove('bg-red-100', 'text-red-800');
            document.getElementById('timer-box').classList.add('bg-amber-100', 'text-amber-800');

            clearInterval(timer);

                if (isPaused) return;
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;

                    document.getElementById('timer-box').classList.remove('bg-amber-100', 'text-amber-800');
                    document.getElementById('timer-box').classList.add('bg-red-100', 'text-red-800');

                    clearInterval(timer);

        function processSpokenAnswer(text) {
            if (!isAnswering || isPaused) return;
            
            // 智慧修正同音字：八、九、四等常見發音
            text = text.replace(/把|爸|吧|爬/g, '八')
                       .replace(/求|走|酒|久/g, '九')
                       .replace(/是|事|市|室/g, '四');
            
            document.getElementById('transcript').innerText = text;

            const numbers = text.match(/\d+/g);
            let parsedNum = null;

            if (numbers && numbers.length > 0) {
                parsedNum = parseInt(numbers.join(''));
            } else {
                parsedNum = parseChineseNumberToInt(text);
            }

            if (parsedNum !== null) {
                checkAnswer(parsedNum, text);
            }
        }

        function parseChineseNumberToInt(str) {
            str = str.trim();

            const map = {
                '零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4,
                '五': 5, '六': 6, '七': 7, '八': 8, '九': 9
            };

            if (str === '一千' || str === '千') return 1000;

            if (str.includes('千') || str.includes('百') || str.includes('十')) {
                let val = 0;
                let temp = 0;
                let hasCN = false;

                for (let i = 0; i < str.length; i++) {
                    let char = str[i];
                    if (map[char] !== undefined) {
                        temp = map[char];
                        hasCN = true;
                    } else if (char === '千') {
                        val += (temp || 1) * 1000;
                        temp = 0;
                        hasCN = true;
                    } else if (char === '百') {
                        val += (temp || 1) * 100;
                        temp = 0;
                        hasCN = true;
                    } else if (char === '十') {
                        val += (temp || 1) * 10;
                        temp = 0;
                        hasCN = true;
                    }
                }
                val += temp;
                if (hasCN && val > 0) return val;
            }

            let foundDigits = [];
            for (let char of str) {
                if (map[char] !== undefined) {
                    foundDigits.push(map[char]);
                }
            }

            if (foundDigits.length >= 2) {
                return foundDigits[0] * 10 + foundDigits[1];
            } else if (foundDigits.length === 1) {
                return foundDigits[0];
            }

            return null;
        }

        function submitManualAnswer() {
            const val = parseInt(document.getElementById('manual-input').value);
            if (!isNaN(val)) {
                checkAnswer(val, val.toString());
            }
        }

        function checkAnswer(userAns, rawText) {
            if (!isAnswering || isPaused) return;
            isAnswering = false;
            stopRecognition();
            clearInterval(timer);

            const currentQ = questions[currentIndex];
            const numericUserAns = Number(userAns);
            const numericCorrectAns = Number(currentQ.ans);
            const isCorrect = (numericUserAns === numericCorrectAns);

            if (isCorrect) {
                correctCount++;
                showFeedback(true);
            } else {
                const qStr = currentQ.display ? currentQ.display : `${currentQ.a} ${currentQ.op} ${currentQ.b}`;
                wrongRecords.push({
                    question: qStr,
                    status: '回答錯誤',
                    userAns: rawText,
                    correctAns: currentQ.ans
                });
                showFeedback(false);
            }

            currentIndex++;
            setTimeout(nextQuestion, 800);
        }

        function showFeedback(isCorrect) {
            const card = document.getElementById('card-question');
            if (isCorrect) {
                card.innerHTML = `<span class="text-green-300">正確! O</span>`;
            } else {
                card.innerHTML = `<span class="text-red-300">錯誤! X</span>`;
            }
        }

        function stopRecognition() {
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        function endGame(titleText) {
            stopRecognition();
            clearInterval(timer);

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-title').innerText = titleText;

            document.getElementById('correct-count').innerText = correctCount;
            document.getElementById('wrong-count').innerText = wrongRecords.length;

            renderWrongTable();
        }

        function renderWrongTable() {
            const container = document.getElementById('wrong-list-container');
            container.innerHTML = '';

            if (wrongRecords.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-green-600 font-bold"><i class="fa-solid fa-circle-check text-2xl mb-1"></i><br>太神啦！全數答對，無任何錯題記錄！</div>`;
                return;
            }

            let tableHTML = `
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 border-b">
                            <th class="p-2 font-bold w-10 text-center">序號</th>
                            <th class="p-2 font-bold">題目</th>
                            <th class="p-2 font-bold">作答狀態</th>
                            <th class="p-2 font-bold">學生回答</th>
                            <th class="p-2 font-bold">正確答案</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            wrongRecords.forEach((rec, idx) => {
                tableHTML += `
                    <tr class="border-b hover:bg-gray-50" style="page-break-inside: avoid; break-inside: avoid;">
                        <td class="p-2 text-center text-gray-500">${idx + 1}</td>
                        <td class="p-2 font-bold text-indigo-700">${rec.question}</td>
                        <td class="p-2 text-red-600 font-medium">${rec.status}</td>
                        <td class="p-2 text-gray-600 font-bold">${rec.userAns}</td>
                        <td class="p-2 font-bold text-green-600">${rec.correctAns}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-export-area');
            const container = document.getElementById('wrong-list-container');
            
            const prevMaxHeight = container.style.maxHeight;
            const prevOverflow = container.style.overflow;
            
            container.style.maxHeight = 'none';
            container.style.overflow = 'visible';

            const trs = element.querySelectorAll('tr');
            trs.forEach(tr => {
                tr.style.pageBreakInside = 'avoid';
                tr.style.breakInside = 'avoid';
            });

            const prevScrollY = window.scrollY;
            window.scrollTo(0, 0);

            setTimeout(() => {
                const totalHeight = element.scrollHeight;
                const opt = {
                    margin:       [10, 10, 15, 10],
                    filename:     '數學計算能力挑戰王_錯題記錄.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false, 
                        letterRendering: true,
                        scrollY: 0,
                        height: totalHeight,
                        windowHeight: totalHeight + 300
                    },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
                };

                html2pdf().from(element).set(opt).save().then(() => {
                    container.style.maxHeight = prevMaxHeight;
                    container.style.overflow = prevOverflow;
                    window.scrollTo(0, prevScrollY);
                }).catch((err) => {
                    console.error("PDF 匯出錯誤:", err);
                    container.style.maxHeight = prevMaxHeight;
                    container.style.overflow = prevOverflow;
                    window.scrollTo(0, prevScrollY);
                });
            }, 250);
        }

        function resetGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
