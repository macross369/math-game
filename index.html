<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數學計算能力挑戰王</title>

    <!-- PWA Web App Manifest 內嵌設置 -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"數學計算能力挑戰王","short_name":"數學挑戰王","description":"多重主題數學大挑戰，支援語音辨識與錯題 PDF 匯出！","start_url":".","display":"standalone","background_color":"#EEF2FF","theme_color":"#4F46E5","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234F46E5%22/><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="數學挑戰王">

    <!-- 引入 Tailwind CSS 進行現代化響應式排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 html2pdf 庫供匯出 PDF 使用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col items-center justify-center p-3 md:p-4 text-gray-800">


<!-- 修改：使用轉換後的 Google Drive 直接連結 -->
<div class="w-full max-w-4xl flex items-center justify-start mb-4 px-2 fade-in">
    <img src="https://lh3.googleusercontent.com/d/1qUdM3yxfDP9U8S1PAlYScLXLG9riPxMt" alt="閒雲數學小棧Logo" class="h-8 w-auto mr-3 object-contain drop-shadow-md rounded-full bg-white/30 p-1" onerror="this.src='https://placehold.co/40x40/ffffff/333333?text=Logo'">
    <span class="text-xl md:text-2xl font-bold text-white drop-shadow-lg tracking-wider" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">閒雲數學小棧</span>
</div>

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-5 md:p-8 transition-all duration-300">
        
        <!-- 標題列與 PWA 安裝按鈕 -->
        <div class="text-center mb-5 relative">
            <h1 class="text-2xl md:text-4xl font-extrabold text-indigo-600 flex items-center justify-center gap-2 md:gap-3">
                <i class="fa-solid fa-crown text-yellow-500"></i> 數學計算能力挑戰王
            </h1>
            <p class="text-gray-500 mt-1 text-xs md:text-sm">多重主題數學大挑戰，支援語音辨識與錯題 PDF 完美匯出！</p>
            
            <!-- PWA 安裝按鈕（若瀏覽器支援離線安裝會自動顯示） -->
            <button id="pwa-install-btn" onclick="installPWA()" class="hidden mt-3 inline-flex items-center gap-2 px-4 py-1.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-xs rounded-full shadow-md hover:opacity-90 transition animate-bounce">
                <i class="fa-solid fa-download"></i> 安裝為手機 App
            </button>
        </div>

        <!-- 畫面一：設定區 -->
        <div id="setup-screen" class="space-y-5">
            <div class="bg-indigo-50/60 p-4 md:p-5 rounded-2xl border border-indigo-100 space-y-4">
                
                <!-- 1. 選擇測驗主題 -->
                <div>
                    <label class="block font-bold text-gray-700 text-sm md:text-base mb-2">
                        <i class="fa-solid fa-book-open text-indigo-500 mr-1.5"></i> 選擇測驗主題：
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="topic" value="multiply" checked onclick="updateCategoryOptions()" class="peer hidden">
                            <div class="p-2.5 bg-rose-100/70 border-2 border-rose-200 rounded-xl text-center text-rose-800 font-bold text-xs sm:text-sm peer-checked:border-rose-500 peer-checked:bg-rose-200/80 peer-checked:shadow-sm transition">
                                乘法運算
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="topic" value="add" onclick="updateCategoryOptions()" class="peer hidden">
                            <div class="p-2.5 bg-amber-100/70 border-2 border-amber-200 rounded-xl text-center text-amber-800 font-bold text-xs sm:text-sm peer-checked:border-amber-500 peer-checked:bg-amber-200/80 peer-checked:shadow-sm transition">
                                加法運算
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="topic" value="sub" onclick="updateCategoryOptions()" class="peer hidden">
                            <div class="p-2.5 bg-sky-100/70 border-2 border-sky-200 rounded-xl text-center text-sky-800 font-bold text-xs sm:text-sm peer-checked:border-sky-500 peer-checked:bg-sky-200/80 peer-checked:shadow-sm transition">
                                減法運算
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="topic" value="div" onclick="updateCategoryOptions()" class="peer hidden">
                            <div class="p-2.5 bg-emerald-100/70 border-2 border-emerald-200 rounded-xl text-center text-emerald-800 font-bold text-xs sm:text-sm peer-checked:border-emerald-500 peer-checked:bg-emerald-200/80 peer-checked:shadow-sm transition">
                                除法運算
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 2. 選擇細分類別 -->
                <div>
                    <label class="block font-bold text-gray-700 text-base md:text-lg mb-2">
                        <i class="fa-solid fa-list-check text-indigo-500 mr-1.5"></i> 選擇細分類別：
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="category-container">
                        <!-- 動態切換次類別 -->
                    </div>
                </div>

                <!-- 3. 選擇題型模式 -->
                <div>
                    <label class="block font-bold text-gray-700 text-base md:text-lg mb-2">
                        <i class="fa-solid fa-layer-group text-indigo-500 mr-1.5"></i> 選擇題型模式：
                    </label>
                    <div class="grid grid-cols-1 gap-2.5" id="mode-container">
                        <!-- 動態切換模式 -->
                    </div>
                </div>

                <!-- 4. 選擇秒數 -->
                <div>
                    <label class="block font-bold text-gray-700 text-sm md:text-base mb-2">
                        <i class="fa-solid fa-stopwatch text-indigo-500 mr-1.5"></i> 每題限制秒數：
                    </label>
                    <select id="time-limit" class="w-full p-2.5 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        <option value="1">1 秒 (閃電極速)</option>
                        <option value="2">2 秒 (高壓挑戰)</option>
                        <option value="3">3 秒 (極速挑戰)</option>
                        <option value="5" selected>5 秒 (標準挑戰)</option>
                        <option value="8">8 秒 (輕鬆練習)</option>
                        <option value="10">10 秒 (進階專用)</option>
                    </select>
                </div>
            </div>

            <button onclick="startGame()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-lg rounded-2xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 開始挑戰
            </button>
        </div>

        <!-- 畫面二：遊戲作答區 -->
        <div id="game-screen" class="hidden space-y-4">
            <!-- 頂部資訊列 -->
            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl border">
                <div class="text-xs md:text-sm font-semibold text-gray-600">
                    進度：<span id="current-index" class="text-indigo-600 font-bold">1</span> / <span id="total-count">45</span> 題
                </div>
                <div id="timer-box" class="flex items-center gap-1.5 px-3 py-1 bg-amber-100 text-amber-800 rounded-full font-bold text-xs md:text-sm">
                    <i class="fa-solid fa-clock"></i> <span id="time-left">5</span> 秒
                </div>
            </div>

            <!-- 牌卡區（可點擊手動觸發麥克風） -->
            <div onclick="requestMicPermission()" class="cursor-pointer flex flex-col items-center justify-center py-8 md:py-10 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl shadow-inner text-white relative overflow-hidden active:scale-[0.99] transition">
                <div class="text-4xl sm:text-6xl md:text-7xl font-black tracking-wider drop-shadow-md select-none" id="card-question">
                    15 + 7 = ?
                </div>
                <div class="mt-4 flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-medium animate-pulse" id="mic-status-text">
                    <i class="fa-solid fa-microphone text-red-300"></i> 請直接口述或點此啟動語音
                </div>
            </div>

            <!-- 即時辨識結果與手動輸入備用區 -->
            <div class="space-y-2.5">
                <div class="text-center text-xs text-gray-500">
                    語音辨識：<span id="transcript" class="font-bold text-indigo-600 italic">（等待語音中...）</span>
                </div>
                
                <div class="flex justify-center items-center gap-2">
                    <input type="number" id="manual-input" placeholder="答案" class="w-28 p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center text-lg font-bold">
                    <button onclick="submitManualAnswer()" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-900 active:bg-black text-white font-bold rounded-xl transition text-sm">送出</button>
                </div>

                <!-- 螢幕觸控數字鍵盤 (針對手機/平板優化) -->
                <div class="bg-gray-100 p-2.5 rounded-2xl border space-y-2">
                    <div class="grid grid-cols-5 gap-1.5 max-w-sm mx-auto">
                        <button onclick="pressKey('1')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">1</button>
                        <button onclick="pressKey('2')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">2</button>
                        <button onclick="pressKey('3')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">3</button>
                        <button onclick="pressKey('4')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">4</button>
                        <button onclick="pressKey('5')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">5</button>
                        <button onclick="pressKey('6')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">6</button>
                        <button onclick="pressKey('7')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">7</button>
                        <button onclick="pressKey('8')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">8</button>
                        <button onclick="pressKey('9')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">9</button>
                        <button onclick="pressKey('0')" class="py-2.5 bg-white hover:bg-indigo-50 active:bg-indigo-100 rounded-xl font-black text-lg text-gray-700 shadow-sm border border-gray-200">0</button>
                    </div>
                    <div class="flex justify-center gap-2 max-w-sm mx-auto">
                        <button onclick="pressKey('clear')" class="flex-1 py-1.5 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold rounded-xl text-xs shadow">清除</button>
                        <button onclick="pressKey('back')" class="flex-1 py-1.5 bg-gray-600 hover:bg-gray-700 active:bg-gray-800 text-white font-bold rounded-xl text-xs shadow">退格 ⌫</button>
                        <button onclick="submitManualAnswer()" class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl text-xs shadow">送出 ↵</button>
                    </div>
                </div>
            </div>

            <!-- 控制按鈕列：暫停與中止 -->
            <div class="grid grid-cols-2 gap-2.5 pt-1">
                <button id="pause-btn" onclick="togglePause()" class="py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition text-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-pause"></i> 暫停遊戲
                </button>
                <button onclick="abortGame()" class="py-2.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow transition text-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-stop"></i> 中止挑戰
                </button>
            </div>
        </div>

        <!-- 畫面三：結算與錯題列表區 -->
        <div id="result-screen" class="hidden space-y-5">
            <div class="text-center space-y-1.5">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full text-3xl mb-1">
                    <i class="fa-solid fa-award"></i>
                </div>
                <h2 id="result-title" class="text-2xl font-extrabold text-gray-800">挑戰完成！</h2>
                <p class="text-gray-500 text-xs">來看看你的計算能力表現與錯題分析吧！</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-green-50 border border-green-200 p-3 rounded-2xl text-center">
                    <div class="text-xs text-green-600 font-semibold">答對題數</div>
                    <div id="correct-count" class="text-2xl font-extrabold text-green-700 mt-0.5">0</div>
                </div>
                <div class="bg-red-50 border border-red-200 p-4 rounded-2xl text-center">
                    <div class="text-xs text-red-600 font-semibold">錯題/未完成題數</div>
                    <div id="wrong-count" class="text-2xl font-extrabold text-red-700 mt-0.5">0</div>
                </div>
            </div>

            <!-- 錯題清單區塊 (供畫面檢視與匯出 PDF 使用) -->
            <div id="pdf-export-area" class="space-y-2.5 bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-gray-800 text-sm md:text-base flex items-center gap-1.5">
                        <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 需要加強的錯題記錄
                    </h3>
                    <span class="text-[10px] text-gray-400 font-medium">數學計算能力挑戰王 報告</span>
                </div>
                
                <div id="wrong-list-container" class="max-h-52 overflow-y-auto space-y-1.5">
                    <!-- 動態填入 -->
                </div>
            </div>

            <!-- 操作按鈕列 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button onclick="downloadPDF()" class="py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition text-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-file-pdf"></i> 下載錯題 PDF 檔
                </button>
                <button onclick="resetGame()" class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition text-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-rotate-right"></i> 再次挑戰
                </button>
            </div>
        </div>

    </div>

    <!-- 邏輯控制 JavaScript -->
    <script>
        // PWA 註冊與安裝事件處理
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwa-install-btn');
            if (btn) btn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') {
                        document.getElementById('pwa-install-btn').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // Service Worker 註冊 (使用 Blob 特殊技巧支援單一檔案離線 App)
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        // 題目與遊戲狀態變數
        let questions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongRecords = []; 
        let timeLimit = 5;
        let timeLeft = 5;
        let timer = null;
        let recognition = null;
        let isAnswering = false;
        let isPaused = false;
        let lastTranscript = '';

        // 主題色系對應配置
        const colorSchemes = {
            multiply: { border: 'border-rose-400', bg: 'bg-rose-500', text: 'text-rose-700', activeBg: 'bg-rose-100' },
            add: { border: 'border-amber-400', bg: 'bg-amber-500', text: 'text-amber-700', activeBg: 'bg-amber-100' },
            sub: { border: 'border-sky-400', bg: 'bg-sky-500', text: 'text-sky-700', activeBg: 'bg-sky-100' },
            div: { border: 'border-emerald-400', bg: 'bg-emerald-500', text: 'text-emerald-700', activeBg: 'bg-emerald-100' }
        };

        window.onload = function() {
            updateCategoryOptions();
            document.getElementById('manual-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') submitManualAnswer();
            });
        };

        function getCurrentTopic() {
            return document.querySelector('input[name="topic"]:checked').value;
        }

        function updateCategoryOptions() {
            const topic = getCurrentTopic();
            const container = document.getElementById('category-container');
            const color = colorSchemes[topic];
            
            let html = '';
            if (topic === 'multiply') {
                html = `
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="mul-1" checked onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別一：九九乘法</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="mul-2" onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別二：十十乘法</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="mul-3" onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別三：25的倍數</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="mul-4" onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別四：125的倍數</div>
                    </label>
                    <label class="cursor-pointer sm:col-span-2">
                        <input type="radio" name="category" value="mul-5" onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別五：11~20 × 2~10</div>
                    </label>
                `;
            } else if (topic === 'add') {
                html = `
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="add-1" checked onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別一：一位數加法</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="add-2" onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別二：10~19加一位數</div>
                    </label>
                    <label class="cursor-pointer sm:col-span-2">
                        <input type="radio" name="category" value="add-3" onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別三：和 10 運算</div>
                    </label>
                `;
            } else if (topic === 'sub') {
                html = `
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="sub-1" checked onclick="updateModeOptions()" class="peer hidden">
                        <div class="p-2.5 bg-white border-2 border-gray-200 rounded-xl text-xs sm:text-sm font-bold peer-checked:${color.border} peer-checked:${color.activeBg} ${color.text} transition">類別一：一位數減法</div>
                    </label>

        // 請求麥克風權限（針對 GAS 嵌入環境特別優化）
        function requestMicPermission() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        stream.getTracks().forEach(track => track.stop());
                        document.getElementById('mic-status-text').innerHTML = `<i class="fa-solid fa-microphone text-green-300"></i> 語音啟動中...`;
                        if (recognition && isAnswering && !isPaused) {

                        }
                    })
                    .catch(err => {
                        document.getElementById('mic-status-text').innerHTML = `<i class="fa-solid fa-keyboard text-yellow-300"></i> 請使用下方數字鍵盤作答`;
                    });
            }

        // 初始化語音辨識
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('mic-status-text').innerHTML = `<i class="fa-solid fa-keyboard text-yellow-300"></i> 請使用下方數字鍵盤作答`;
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (isPaused || !isAnswering) return;
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const transcriptText = finalTranscript || interimTranscript;
                lastTranscript = transcriptText;
                document.getElementById('transcript').innerText = transcriptText;

                if (finalTranscript) {
                    processSpokenAnswer(finalTranscript);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    document.getElementById('mic-status-text').innerHTML = `<i class="fa-solid fa-keyboard text-yellow-300"></i> 請使用下方數字鍵盤作答`;
                }
            };

            recognition.onend = () => {
                if (isAnswering && !isPaused) {
                    try { recognition.start(); } catch (e) {}
                }
            };
        }

                for (let j = 1; j <= 8; j++) {

                }
            } else if (category === 'mul-5') {

                    }
                }

                if (mode === 'add-1-std') {

                        for (let j = 1; j <= 9; j++) {
                            list.push({ display: `${i} + ${j} = ?`, ans: i + j });
                        }

                } else {
                    for (let i = 1; i <= 9; i++) {
                        for (let j = i; j <= 9; j++) {
                            list.push({ display: `${i} + ${j} = ?`, ans: i + j });
                        }
                    }

            } else if (category === 'add-2') {

                    for (let j = 1; j <= 9; j++) {
                        list.push({ display: `${i} + ${j} = ?`, ans: i + j });
                    }
                }
            } else if (category === 'add-3') {
                for (let i = 1; i <= 9; i++) {
                    list.push({ display: `${i} + ? = 10`, ans: 10 - i });
                    list.push({ display: `? + ${i} = 10`, ans: 10 - i });
                }
            } else if (category === 'sub-1') {
                for (let i = 1; i <= 9; i++) {
                    for (let j = 1; j <= i; j++) {
                        list.push({ display: `${i} - ${j} = ?`, ans: i - j });
                    }
                }
            } else if (category === 'sub-2') {
                for (let i = 10; i <= 19; i++) {
                    for (let j = 1; j <= 9; j++) {
                        list.push({ display: `${i} - ${j} = ?`, ans: i - j });
                    }
                }
            } else if (category === 'div-1') {
                for (let i = 1; i <= 9; i++) {
                    for (let j = 2; j <= 9; j++) {
                        let product = i * j;
                        list.push({ display: `${product} ÷ ${j} = ?`, ans: i });
                    }
                }
            } else {
                let limit = 20;
                if (category === 'div-3') limit = 40;
                else if (category === 'div-4') limit = 70;
                else if (category === 'div-5') limit = 100;

                for (let n = 2; n <= limit; n++) {
                    for (let d = 2; d < n; d++) {
                        if (n % d === 0) {
                            list.push({ display: `${n} ÷ ${d} = ?`, ans: n / d });
                        }
                    }
                }
            }
            return list.sort(() => Math.random() - 0.5);

        function processSpokenAnswer(text) {
            if (!isAnswering || isPaused) return;
            
            text = text.replace(/把|爸|吧|爬/g, '八')
                       .replace(/求|走|酒|久/g, '九')
                       .replace(/是|事|市|室/g, '四');
            
            document.getElementById('transcript').innerText = text;

            const numbers = text.match(/\d+/g);
            let parsedNum = null;

            if (numbers && numbers.length > 0) {
                parsedNum = parseInt(numbers.join(''));
            } else {
                parsedNum = parseChineseNumberToInt(text);
            }

            if (parsedNum !== null) {
                checkAnswer(parsedNum, text);
            }
        }

        function parseChineseNumberToInt(str) {
            str = str.trim();

            const map = {
                '零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4,
                '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10,
                '百': 100, '千': 1000
            };

            if (str === '一百') return 100;
            if (str === '一千') return 1000;

            if (str.includes('千')) {
                let parts = str.split('千');
                let thousands = map[parts[0]] || 1;
                let remainder = parts[1] ? parseChineseNumberToInt(parts[1]) : 0;
                return thousands * 1000 + remainder;
            }

            if (str.includes('百')) {
                let parts = str.split('百');
                let hundreds = map[parts[0]] || 1;
                let remainder = parts[1] ? parseChineseNumberToInt(parts[1]) : 0;
                return hundreds * 100 + remainder;
            }

            if (str.includes('十')) {
                let parts = str.split('十');
                let tens = parts[0] === '' ? 1 : (map[parts[0]] || 1);
                let ones = parts[1] ? (map[parts[1]] || 0) : 0;
                return tens * 10 + ones;
            }

            let foundDigits = [];
            for (let char of str) {
                if (map[char] !== undefined) {
                    foundDigits.push(map[char]);
                }
            }

            if (foundDigits.length > 0) {
                return parseInt(foundDigits.join(''));
            }

            return null;
        }

        function checkAnswer(userAns, rawText) {
            if (!isAnswering || isPaused) return;
            isAnswering = false;
            stopRecognition();
            clearInterval(timer);

            const currentQ = questions[currentIndex];
            const numericUserAns = Number(userAns);
            const numericCorrectAns = Number(currentQ.ans);
            const isCorrect = (numericUserAns === numericCorrectAns);

            if (isCorrect) {
                correctCount++;
                showFeedback(true);
            } else {
                wrongRecords.push({
                    question: currentQ.display,
                    status: '回答錯誤',
                    userAns: rawText,
                    correctAns: currentQ.ans
                });
                showFeedback(false);
            }

            currentIndex++;
            setTimeout(nextQuestion, 800);
        }

        function showFeedback(isCorrect) {
            const card = document.getElementById('card-question');
            if (isCorrect) {
                card.innerHTML = `<span class="text-green-300">正確! O</span>`;
            } else {
                card.innerHTML = `<span class="text-red-300">錯誤! X</span>`;
            }
        }

        function stopRecognition() {
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        function endGame(titleText) {
            stopRecognition();
            clearInterval(timer);

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-title').innerText = titleText;

            document.getElementById('correct-count').innerText = correctCount;
            document.getElementById('wrong-count').innerText = wrongRecords.length;

            renderWrongTable();
        }

        function renderWrongTable() {
            const container = document.getElementById('wrong-list-container');
            container.innerHTML = '';

            if (wrongRecords.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-green-600 font-bold text-sm"><i class="fa-solid fa-circle-check text-2xl mb-1"></i><br>太神啦！全數答對，無任何錯題記錄！</div>`;
                return;
            }

            let tableHTML = `
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 border-b">
                            <th class="p-2 font-bold w-10 text-center">序號</th>
                            <th class="p-2 font-bold">題目</th>
                            <th class="p-2 font-bold">作答狀態</th>
                            <th class="p-2 font-bold">回答</th>
                            <th class="p-2 font-bold">正確答案</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            wrongRecords.forEach((rec, idx) => {
                tableHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 text-center text-gray-500">${idx + 1}</td>
                        <td class="p-2 font-bold text-indigo-700">${rec.question}</td>
                        <td class="p-2 text-red-600 font-medium">${rec.status}</td>
                        <td class="p-2 text-gray-600 font-bold">${rec.userAns}</td>
                        <td class="p-2 font-bold text-green-600">${rec.correctAns}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-export-area');
            const container = document.getElementById('wrong-list-container');
            
            window.scrollTo(0, 0);

            const prevMaxHeight = container.style.maxHeight;
            const prevOverflow = container.style.overflow;
            container.style.maxHeight = 'none';
            container.style.overflow = 'visible';

            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     '數學計算能力挑戰王_錯題記錄.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false, windowWidth: 800 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'] }
            };

            setTimeout(() => {
                html2pdf().from(element).set(opt).save().then(() => {
                    container.style.maxHeight = prevMaxHeight;
                    container.style.overflow = prevOverflow;
                }).catch((err) => {
                    console.error("PDF 匯出錯誤:", err);
                    container.style.maxHeight = prevMaxHeight;
                    container.style.overflow = prevOverflow;
                });
            }, 300);
        }

        function resetGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
